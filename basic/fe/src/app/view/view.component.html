<div class="detail-page">
  <button class="btn-back" (click)="back()">← Back</button>

  <div class="detail-card" *ngIf="!loading && chunk">
    <h2>Chunk Details</h2>

    <div class="meta-row">
      <div class="meta-item">
        <span class="label">Source File</span>
        <span class="value">{{ chunk.source }}</span>
      </div>
      <div class="meta-item">
        <span class="label">Page</span>
        <span class="value">{{ chunk.page }}</span>
      </div>
      <div class="meta-item">
        <span class="label">ID</span>
        <span class="value mono">{{ chunk.id }}</span>
      </div>
    </div>

    <div class="content-section">
      <span class="label">Content</span>
      <p class="content-text">{{ chunk.content }}</p>
    </div>
  </div>

  <div class="loading" *ngIf="loading">Loading…</div>
  <div class="error-msg" *ngIf="error">{{ error }}</div>
</div>
